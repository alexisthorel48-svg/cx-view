<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CX-View — Connexion</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f1117; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.login-box { background: #1a1d27; border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
h1 { text-align: center; font-size: 2rem; color: #00d4ff; margin-bottom: 6px; }
.subtitle { text-align: center; color: #8892a4; font-size: .9rem; margin-bottom: 32px; }
.form-group { margin-bottom: 16px; }
label { display: block; font-size: .75rem; font-weight: 600; color: #8892a4; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
input { width: 100%; padding: 12px 16px; background: #252836; border: 1px solid #2e3347; border-radius: 8px; color: #fff; font-size: .95rem; outline: none; transition: border-color .2s; }
input:focus { border-color: #00d4ff; }
button { width: 100%; padding: 14px; background: #00d4ff; color: #0f1117; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 8px; transition: opacity .2s; }
button:hover { opacity: .9; }
.error { background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.4); color: #f87171; padding: 12px 16px; border-radius: 8px; font-size: .875rem; margin-bottom: 16px; display: none; }
</style>
</head>
<body>
<div class="login-box">
  <h1>CX-View</h1>
  <p class="subtitle">Plateforme d'affichage dynamique</p>
  <div class="error" id="err"></div>
  <div class="form-group">
    <label>Email</label>
    <input type="email" id="email" placeholder="votre@email.com" autocomplete="email">
  </div>
  <div class="form-group">
    <label>Mot de passe</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>
  <button onclick="login()">Se connecter</button>
</div>
<script>
document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('err');
  err.style.display = 'none';
  try {
    const r = await fetch('/api/auth/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({email, password}) });
    const d = await r.json();
    if (!r.ok) { err.textContent = d.error || 'Erreur de connexion'; err.style.display = 'block'; return; }
    window.location.href = '/dashboard';
  } catch(e) { err.textContent = 'Erreur réseau'; err.style.display = 'block'; }
}
</script>
</body>
</html>
