<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prévisualisation — CX View</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#090b10;color:#f7f8fb;overflow:hidden}
    #stage{position:absolute;inset:0;display:grid;place-items:center;background:#000}
    #stage>img,#stage>video,#stage>iframe{width:100%;height:100%;object-fit:contain;background:#000;border:0}
    .widget{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;padding:clamp(28px,5vw,92px);background:radial-gradient(circle at 15% 5%,#314764 0,#172233 38%,#080b11 100%)}
    .widget-inner{width:min(1500px,100%);margin:auto}.widget-kicker{text-transform:uppercase;letter-spacing:.18em;font-size:clamp(12px,1.1vw,18px);color:#a9b8ca}.widget-title{font-size:clamp(24px,3vw,58px);margin:0 0 12px}.muted{color:#aeb7c8}
    .clock{text-align:center}.clock-time{font-size:clamp(92px,18vw,300px);font-weight:650;line-height:.9;letter-spacing:-.07em}.clock-date{margin-top:30px;font-size:clamp(24px,3.2vw,54px)}.clock-message{margin-top:16px;font-size:clamp(18px,2vw,34px);color:#aeb7c8}.clock.flip .clock-time span{display:inline-block;background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.12);border-radius:.12em;padding:.06em .12em;box-shadow:inset 0 -2px rgba(255,255,255,.06)}
    .weather-shell{display:grid;gap:clamp(22px,3vw,48px)}.weather-current{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(260px,.75fr);gap:36px;align-items:center}.weather-main{display:flex;align-items:center;gap:clamp(20px,4vw,68px)}.weather-icon{font-size:clamp(100px,15vw,250px);line-height:1}.weather-temp{font-size:clamp(100px,16vw,280px);font-weight:650;letter-spacing:-.08em;line-height:.8}.weather-condition{font-size:clamp(24px,3vw,54px);margin-top:24px}.weather-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.weather-stat{padding:18px 20px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.1);border-radius:20px}.weather-stat span{display:block;color:#aeb7c8;font-size:clamp(13px,1vw,18px)}.weather-stat strong{display:block;margin-top:7px;font-size:clamp(20px,2vw,34px)}
    .forecast{display:grid;grid-template-columns:repeat(var(--days,3),minmax(0,1fr));gap:14px}.forecast-day{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:18px 22px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.1);border-radius:20px}.forecast-day .fi{font-size:clamp(34px,4vw,64px)}.forecast-day b{font-size:clamp(17px,1.5vw,26px)}.forecast-day small{display:block;margin-top:5px;color:#aeb7c8;font-size:clamp(12px,1vw,17px)}.forecast-day strong{font-size:clamp(22px,2vw,36px);white-space:nowrap}
    .weather-shell.compact .weather-current{display:block;text-align:center}.weather-shell.compact .weather-main{justify-content:center}.weather-shell.compact .weather-meta,.weather-shell.compact .forecast{display:none}.weather-shell.banner{width:100%}.weather-shell.banner .weather-current{grid-template-columns:1fr auto}.weather-shell.banner .weather-main{gap:26px}.weather-shell.banner .weather-icon{font-size:clamp(70px,9vw,150px)}.weather-shell.banner .weather-temp{font-size:clamp(70px,10vw,170px)}.weather-shell.banner .weather-meta{display:flex}.weather-shell.banner .forecast{display:none}
    .countdown{text-align:center}.countdown-title{font-size:clamp(26px,4vw,70px)}.countdown-value{font-size:clamp(72px,14vw,240px);font-weight:700;letter-spacing:-.06em;line-height:1}.countdown-label{font-size:clamp(22px,3vw,50px);color:#aeb7c8}.ticker-widget{width:100%;overflow:hidden}.ticker-label{text-align:center;font-size:clamp(24px,3vw,52px);margin-bottom:34px}.ticker-line{white-space:nowrap;font-size:clamp(48px,8vw,130px);font-weight:600;animation:ticker 18s linear infinite}.ticker-line.slow{animation-duration:28s}.ticker-line.fast{animation-duration:10s}@keyframes ticker{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
    .widget-loading,.widget-error{text-align:center}.widget-loading b,.widget-error b{display:block;font-size:clamp(26px,4vw,60px);margin-bottom:12px}.widget-error span{color:#ffb5b5}
    .top{position:absolute;z-index:20;left:18px;right:18px;top:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}.badge,.controls{pointer-events:auto;background:rgba(13,16,23,.82);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(12px);border-radius:12px;padding:10px 12px}.badge strong,.badge span{display:block}.badge span{font-size:12px;color:#aeb7c8;margin-top:3px}.controls{position:absolute;z-index:20;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:8px}button{appearance:none;border:1px solid rgba(255,255,255,.16);background:#191e29;color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer;font:inherit}button:hover{background:#252c3a}#progress{width:min(320px,32vw);height:5px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden}#bar{height:100%;width:0;background:#ffd21c}.empty{color:#aeb7c8;text-align:center}.empty b{display:block;color:#fff;font-size:28px;margin-bottom:8px}
    @media(max-width:760px){.weather-current{grid-template-columns:1fr}.weather-meta{grid-template-columns:repeat(2,1fr)}.forecast{grid-template-columns:1fr}.forecast-day:nth-child(n+4){display:none}.controls{width:calc(100% - 24px);justify-content:center}.badge{max-width:46vw}}
  </style>
</head>
<body>
  <main id="stage"><div class="empty"><b>Chargement…</b><span>Préparation de la playlist</span></div></main>
  <div class="top"><div class="badge"><strong id="playlist-name">Playlist</strong><span id="item-name">Prévisualisation</span></div><div class="badge"><strong id="counter">0 / 0</strong><span id="status">Initialisation</span></div></div>
  <div class="controls"><button id="prev" title="Contenu précédent">←</button><button id="play" title="Pause / lecture">Pause</button><button id="next" title="Contenu suivant">→</button><div id="progress"><div id="bar"></div></div><button id="close" title="Fermer">Fermer</button></div>
<script>
(() => {
  const stage=document.getElementById('stage'),nameEl=document.getElementById('playlist-name'),itemEl=document.getElementById('item-name'),counter=document.getElementById('counter'),status=document.getElementById('status'),bar=document.getElementById('bar'),playBtn=document.getElementById('play');
  const playlistId=new URLSearchParams(location.search).get('playlist');let items=[],media=[],index=0,timer=null,startedAt=0,remaining=0,paused=false,raf=null,widgetCleanup=null,renderToken=0;
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  const mediaById=id=>media.find(m=>Number(m.id)===Number(id));const itemName=it=>{const m=mediaById(it.media_id)||it;return m.title||m.original_name||it.widget_config?.name||it.widget_type||'Contenu'};const fileUrl=m=>m?.file_name?`/files/uploads/${encodeURIComponent(m.file_name)}`:'';const activeItems=()=>items.filter(i=>i.active!==false);
  async function json(url){const r=await fetch(url,{credentials:'same-origin'});if(r.status===401){location.href='/login';throw new Error('Session expirée')}if(!r.ok)throw new Error(await r.text());return r.json()}
  async function load(){if(!playlistId)throw new Error('Playlist absente');const [pls,its,med]=await Promise.all([json('/api/playlists'),json(`/api/playlists/${playlistId}/items`),json('/api/v31/media')]);items=its;media=med;const p=pls.find(x=>Number(x.id)===Number(playlistId));nameEl.textContent=p?.name||'Playlist';if(!activeItems().length){stage.innerHTML='<div class="empty"><b>Playlist vide</b><span>Aucun contenu actif à prévisualiser.</span></div>';status.textContent='Vide';return}show(0)}
  const weatherInfo=code=>{const map={0:['☀️','Ciel dégagé'],1:['🌤️','Peu nuageux'],2:['⛅','Partiellement nuageux'],3:['☁️','Couvert'],45:['🌫️','Brouillard'],48:['🌫️','Brouillard givrant'],51:['🌦️','Bruine légère'],53:['🌦️','Bruine'],55:['🌧️','Bruine forte'],61:['🌦️','Pluie légère'],63:['🌧️','Pluie'],65:['🌧️','Pluie forte'],71:['🌨️','Neige légère'],73:['🌨️','Neige'],75:['❄️','Neige forte'],80:['🌦️','Averses'],81:['🌧️','Averses'],82:['⛈️','Fortes averses'],95:['⛈️','Orage'],96:['⛈️','Orage et grêle'],99:['⛈️','Orage violent']};return map[code]||['🌤️','Météo variable']};
  const dayName=d=>new Intl.DateTimeFormat('fr-BE',{weekday:'short'}).format(new Date(`${d}T12:00:00`)).replace('.','').toUpperCase();
  async function weatherWidget(it,token){const cfg=it.widget_config||{},city=cfg.city||cfg.value||'Soignies',days=Math.min(5,Math.max(1,Number(cfg.forecastDays||3))),style=cfg.style||'premium';stage.innerHTML=`<section class="widget"><div class="widget-loading"><b>☁️ ${esc(city)}</b><span>Chargement de la météo…</span></div></section>`;const geo=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=fr&format=json`).then(r=>r.json());if(token!==renderToken)return;const place=geo.results?.[0];if(!place)throw new Error(`Ville introuvable : ${city}`);const url=`https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto&forecast_days=${days}`;const w=await fetch(url).then(r=>r.json());if(token!==renderToken)return;const [icon,condition]=weatherInfo(w.current.weather_code),forecast=w.daily.time.map((d,i)=>{const [fi,fc]=weatherInfo(w.daily.weather_code[i]);return `<div class="forecast-day"><span class="fi">${fi}</span><div><b>${i===0?'AUJOURD’HUI':dayName(d)}</b><small>${esc(fc)}</small></div><strong>${Math.round(w.daily.temperature_2m_max[i])}° <span class="muted">${Math.round(w.daily.temperature_2m_min[i])}°</span></strong></div>`}).join('');const stats=[];if(cfg.showFeelsLike!==false)stats.push(`<div class="weather-stat"><span>Ressenti</span><strong>${Math.round(w.current.apparent_temperature)}°C</strong></div>`);if(cfg.showHumidity!==false)stats.push(`<div class="weather-stat"><span>Humidité</span><strong>${Math.round(w.current.relative_humidity_2m)} %</strong></div>`);if(cfg.showWind!==false)stats.push(`<div class="weather-stat"><span>Vent</span><strong>${Math.round(w.current.wind_speed_10m)} km/h</strong></div>`);if(cfg.showSun!==false)stats.push(`<div class="weather-stat"><span>Soleil</span><strong>${new Date(w.daily.sunrise[0]).toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'})} – ${new Date(w.daily.sunset[0]).toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'})}</strong></div>`);stage.innerHTML=`<section class="widget"><div class="widget-inner weather-shell ${esc(style)}"><header><div class="widget-kicker">Météo en direct</div><h1 class="widget-title">${esc(place.name)}${place.admin1?', '+esc(place.admin1):''}</h1></header><div class="weather-current"><div class="weather-main"><div class="weather-icon">${icon}</div><div><div class="weather-temp">${Math.round(w.current.temperature_2m)}°</div><div class="weather-condition">${esc(condition)}</div></div></div><div class="weather-meta">${stats.join('')}</div></div>${days>1?`<div class="forecast" style="--days:${days}">${forecast}</div>`:''}</div></section>`}
  function clockWidget(it){const cfg=it.widget_config||{},style=cfg.style||'date',zone=cfg.timezone||'Europe/Brussels';const draw=()=>{const now=new Date(),parts=new Intl.DateTimeFormat('fr-BE',{timeZone:zone,hour:'2-digit',minute:'2-digit',second:cfg.showSeconds?'2-digit':undefined,hour12:false}).format(now),date=new Intl.DateTimeFormat('fr-BE',{timeZone:zone,weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(now);const visual=style==='flip'?parts.split(':').map(x=>`<span>${x}</span>`).join(' : '):parts;stage.innerHTML=`<section class="widget"><div class="widget-inner clock ${esc(style)}"><div class="clock-time">${visual}</div>${cfg.showDate!==false?`<div class="clock-date">${esc(date)}</div>`:''}${cfg.message?`<div class="clock-message">${esc(cfg.message)}</div>`:''}</div></section>`};draw();const id=setInterval(draw,1000);widgetCleanup=()=>clearInterval(id)}
  function countdownWidget(it){const cfg=it.widget_config||{},target=new Date(cfg.value),draw=()=>{let diff=target-Date.now();if(!Number.isFinite(diff)){stage.innerHTML='<section class="widget"><div class="widget-error"><b>Compte à rebours</b><span>Date cible invalide</span></div></section>';return}if(diff<=0){stage.innerHTML=`<section class="widget"><div class="widget-inner countdown"><div class="countdown-title">${esc(cfg.title||cfg.name||'Événement')}</div><div class="countdown-value">${esc(cfg.endedText||'C’est maintenant !')}</div></div></section>`;return}const days=Math.floor(diff/86400000);diff%=86400000;const h=Math.floor(diff/3600000),m=Math.floor(diff%3600000/60000),s=Math.floor(diff%60000/1000);stage.innerHTML=`<section class="widget"><div class="widget-inner countdown"><div class="countdown-title">${esc(cfg.title||cfg.name||'Événement')}</div><div class="countdown-value">${days}</div><div class="countdown-label">jour${days>1?'s':''} · ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</div></div></section>`};draw();const id=setInterval(draw,1000);widgetCleanup=()=>clearInterval(id)}
  async function renderWidget(it,token){const cfg=it.widget_config||{},type=it.widget_type||'WIDGET';try{if(type==='WEATHER')return await weatherWidget(it,token);if(type==='CLOCK')return clockWidget(it);if(type==='COUNTDOWN')return countdownWidget(it);if(type==='TICKER'){stage.innerHTML=`<section class="widget"><div class="ticker-widget"><div class="ticker-label">${esc(cfg.name||'Information')}</div><div class="ticker-line ${esc(cfg.speed||'normal')}">${esc(cfg.value||'Votre message')}</div></div></section>`;return}if(type==='WEBPAGE'){stage.innerHTML=`<iframe src="${esc(cfg.value||'about:blank')}" style="zoom:${Number(cfg.zoom||100)/100}" referrerpolicy="no-referrer"></iframe>`;return}if(type==='RSS'){stage.innerHTML=`<section class="widget"><div class="widget-inner"><div class="widget-kicker">Flux RSS</div><h1 class="widget-title">${esc(cfg.name||'Actualités')}</h1><p class="muted">Source configurée : ${esc(cfg.value||'aucune')}</p><p class="muted">Le chargement serveur sécurisé du flux sera raccordé dans la phase RSS.</p></div></section>`;return}stage.innerHTML=`<section class="widget"><div class="widget-inner"><h1 class="widget-title">${esc(cfg.name||type)}</h1></div></section>`}catch(e){if(token!==renderToken)return;stage.innerHTML=`<section class="widget"><div class="widget-error"><b>Widget indisponible</b><span>${esc(e.message)}</span></div></section>`}}
  function show(nextIndex){clearTimeout(timer);cancelAnimationFrame(raf);widgetCleanup?.();widgetCleanup=null;renderToken++;const token=renderToken,list=activeItems();index=(nextIndex+list.length)%list.length;const it=list[index],m=mediaById(it.media_id)||it,duration=Math.max(1,Number(it.duration_seconds||10));itemEl.textContent=itemName(it);counter.textContent=`${index+1} / ${list.length}`;status.textContent=`${duration} s`;bar.style.width='0%';paused=false;playBtn.textContent='Pause';if(it.item_type==='WIDGET')renderWidget(it,token);else if(it.item_type==='CANVAS')stage.innerHTML='<section class="widget"><div class="widget-inner"><h1 class="widget-title">Slide composé</h1><p class="muted">Aperçu non disponible pour ce type de contenu</p></div></section>';else if((m.media_type||'').toUpperCase()==='VIDEO'){stage.innerHTML=`<video autoplay muted playsinline src="${fileUrl(m)}"></video>`;const v=stage.querySelector('video');v.addEventListener('ended',()=>show(index+1),{once:true});v.play().catch(()=>{})}else stage.innerHTML=`<img src="${fileUrl(m)}" alt="${esc(itemName(it))}">`;remaining=duration*1000;startedAt=performance.now();tick();timer=setTimeout(()=>show(index+1),remaining)}
  function tick(){if(paused)return;const elapsed=performance.now()-startedAt,total=Math.max(1,remaining);bar.style.width=`${Math.min(100,elapsed/total*100)}%`;raf=requestAnimationFrame(tick)}
  function toggle(){const v=stage.querySelector('video');if(!paused){paused=true;clearTimeout(timer);cancelAnimationFrame(raf);remaining=Math.max(0,remaining-(performance.now()-startedAt));v?.pause();playBtn.textContent='Lire';status.textContent='En pause'}else{paused=false;startedAt=performance.now();v?.play().catch(()=>{});timer=setTimeout(()=>show(index+1),remaining);tick();playBtn.textContent='Pause';status.textContent=`${Math.ceil(remaining/1000)} s`}}
  document.getElementById('prev').addEventListener('click',()=>show(index-1));document.getElementById('next').addEventListener('click',()=>show(index+1));playBtn.addEventListener('click',toggle);document.getElementById('close').addEventListener('click',()=>window.close());load().catch(e=>{stage.innerHTML=`<div class="empty"><b>Prévisualisation impossible</b><span>${esc(e.message)}</span></div>`;status.textContent='Erreur'});
})();
</script>
</body>
</html>
